# Placeholder tvOS app whose only purpose is to make Xcode mint and renew the free
# 7-day provisioning profile for the StremioTV bundle ID. Never shipped or installed.
name: Placeholder
options:
  bundleIdPrefix: com.vaibhavtud
  deploymentTarget:
    tvOS: "18.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${STREMIOTV_TEAM_ID}
    PRODUCT_BUNDLE_IDENTIFIER: com.vaibhavtud.stremiotv
    GENERATE_INFOPLIST_FILE: "YES"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Placeholder:
    type: application
    platform: tvOS
    sources: [Sources]
schemes:
  Placeholder:
    build:
      targets:
        Placeholder: all
